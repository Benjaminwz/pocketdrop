<!doctype html>
<!-- 口袋快傳的固定入口（GitHub Pages）。電腦的遠端網址每次都會變，iPhone 把這頁加到主畫面：
     打開時到 ntfy.sh 查電腦現在的遠端網址，第一次順便用 QR code 帶來的配對碼配對，再帶著鑰匙跳過去。
     這頁只在你的手機上執行，鑰匙只存在手機裡，不會傳到 GitHub。 -->
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2656">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="icon" href="../icon.png">
<title>PocketDrop</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a2656;color:#fff;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;text-align:center}
.box{padding:28px;max-width:360px}
img{width:88px;height:88px;border-radius:22px}
h1{font-size:24px;margin:14px 0 6px}
#msg{color:#c1cbee;min-height:3em}
button{margin-top:18px;background:#3558d4;color:#fff;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:700}
#tip{margin-top:22px;font-size:13px;color:#8793c4}
</style></head>
<body><div class="box">
<img src="../icon.png" alt="">
<h1 id="title">PocketDrop</h1>
<div id="msg"></div>
<button id="retry" hidden></button>
<div id="tip"></div>
</div>
<script>
"use strict";
const ZH = (navigator.language || "").toLowerCase().startsWith("zh");
const T = (zh, en) => ZH ? zh : en;
const $ = id => document.getElementById(id);
const store = {
  get: k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} },
};
document.title = $("title").textContent = T("口袋快傳", "PocketDrop");
$("retry").textContent = T("再試一次", "Try again");
$("retry").onclick = () => location.reload();
const say = (text, retry) => { $("msg").textContent = text; $("retry").hidden = !retry; };

// 第一次：QR code 在網址 # 後面帶來 rv（電腦的登記頻道）、code（10 分鐘有效的配對碼）、name（電腦名字）
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get("rv")) {
  if (hash.get("rv") !== store.get("pd_rv")) store.set("pd_key", "");  // 換了一台電腦：舊鑰匙不能用
  store.set("pd_rv", hash.get("rv"));
  store.set("pd_pc", hash.get("name") || "");
}
const code = hash.get("code") || "";
history.replaceState(null, "", location.pathname);  // 清掉網址上的東西，加到主畫面的是乾淨的網址

const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !standalone) {
  $("tip").textContent = T("小技巧：按 Safari 的「分享」→「加入主畫面」，以後從主畫面打開就好。",
    "Tip: tap Share → Add to Home Screen, and open it from there next time.");
}

let devId = store.get("pd_id");
if (!devId) { devId = "web-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); store.set("pd_id", devId); }
const devName = /iPhone/.test(navigator.userAgent) ? "iPhone" : /iPad|Macintosh/.test(navigator.userAgent) ? "iPad" : T("瀏覽器", "Browser");

async function tunnelUrl(rv) {
  // 電腦開遠端模式時會把網址登記在這裡；取最後一筆
  const r = await fetch("https://ntfy.sh/" + encodeURIComponent(rv) + "/json?poll=1&since=all", { cache: "no-store" });
  const lines = (await r.text()).split("\n").filter(Boolean).map(l => JSON.parse(l)).filter(e => e.event === "message");
  const url = lines.length ? lines[lines.length - 1].message.trim() : "";
  return /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url) ? url : "";
}

async function main() {
  const rv = store.get("pd_rv");
  if (!rv) return say(T("還沒連過電腦：請在電腦版口袋快傳按「連接手機」→「iPhone」，掃「在家、在外面都要用」那個 QR code。",
    "Not set up yet: on the PC, click \"Connect a phone\" → iPhone and scan the QR code for home and away."));
  say(T("正在找你的電腦…", "Looking for your PC…"));
  let url;
  try { url = await tunnelUrl(rv); } catch (e) { return say(T("網路好像不通，確認手機有連上網路。", "No internet connection?"), true); }
  if (!url) return say(T("找不到電腦：請確認電腦開著口袋快傳，而且勾了「遠端模式」。", "Can't find your PC: make sure PocketDrop is open with Remote mode on."), true);

  let key = store.get("pd_key");
  try {
    if (key) {  // 確認鑰匙還能用、電腦也連得到
      const r = await fetch(url + "/api/ping", { headers: { "X-Key": key } });
      if (r.status === 401) { key = ""; store.set("pd_key", ""); }
      else if (!r.ok) throw new Error("HTTP " + r.status);
    }
    if (!key) {
      if (!code) return say(T("這支手機要重新配對：在電腦版按「連接手機」→「iPhone」，再掃一次 QR code。",
        "This phone needs to pair again: on the PC, click \"Connect a phone\" → iPhone and scan the QR code."));
      say(T("配對中…", "Pairing…"));
      const r = await fetch(url + "/api/hello?code=" + encodeURIComponent(code), {
        method: "POST", headers: { "X-Device-Id": devId, "X-Device-Name": encodeURIComponent(devName) } });
      if (!r.ok) return say(r.status === 403 ? T("電腦沒有允許（QR code 可能過期了，請重新掃）", "The PC declined (the QR code may have expired; scan again)")
        : T("配對失敗：", "Pairing failed: ") + r.status, true);
      const j = await r.json();
      key = j.key; store.set("pd_key", key); store.set("pd_pc", j.name || store.get("pd_pc"));
    }
  } catch (e) {
    return say(T("連不到電腦（電腦可能剛重開，等一下再試）。", "Can't reach the PC (it may have just restarted; try again shortly)."), true);
  }
  // 帶著鑰匙跳到電腦的網頁版（# 後面的東西不會送到網路上）
  location.replace(url + "/web#pd=" + encodeURIComponent(JSON.stringify({ id: devId, key: key, pc: store.get("pd_pc") })));
}
main();
</script>
</body></html>
